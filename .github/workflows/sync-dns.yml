name: Sync Nebula DNS
on:
  # The schedule ships commented out so a repo generated from this template
  # (and the template itself) doesn't run and fail before secrets exist.
  # Uncomment after adding DN_API_KEY and NETLIFY_TOKEN as repository secrets:
  # schedule:
  #   - cron: "*/15 * * * *"
  workflow_dispatch:

# Two overlapping runs would both see a record as missing and create it twice;
# Netlify accepts exact-duplicate records.
concurrency:
  group: dns-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync DNS records
        env:
          DN_API_KEY: ${{ secrets.DN_API_KEY }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          DOMAIN: example.com
          SUBDOMAIN: dn
        run: node sync-nebula-dns.mjs
