name: Sync Nebula DNS
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Sync DNS records
        env:
          DN_API_KEY: ${{ secrets.DN_API_KEY }}
          NETLIFY_TOKEN: ${{ secrets.NETLIFY_TOKEN }}
          DOMAIN: example.com
          SUBDOMAIN: dn
        run: ./sync-nebula-dns.sh
